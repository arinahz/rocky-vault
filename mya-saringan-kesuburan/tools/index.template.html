<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- GSAP bundled locally: no CDN. Generated by tools/build.py: edit tools/index.template.html -->
    <script src="assets/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Poppins"; font-weight: 700; src: url("assets/fonts/poppins-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 800; src: url("assets/fonts/poppins-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 900; src: url("assets/fonts/poppins-latin-900-normal.woff2") format("woff2"); }
      :root { --teal: #265652; --deep: #173f3c; --gold: #d4af6a; --ink: #1b2624; --cream: #fffaf3; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: "Poppins", sans-serif; }
      .clip { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      video.seg { object-fit: cover; z-index: 1; }
      /* alternate punch-in hides the jump cuts; origin on the face */
      video.punch { transform: scale(1.09); transform-origin: 50% 32%; }
      .center { position: absolute; left: 0; right: 0; text-align: center; }

      /* hook card, readable on frame 0 */
      #hook { position: absolute; left: 70px; right: 70px; top: 1000px; z-index: 5; padding: 30px 36px 36px; border-radius: 44px; background: var(--cream); text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,0.35); }
      #hook .k { font-weight: 800; font-size: 40px; color: var(--teal); }
      #hook .q { font-weight: 900; font-size: 96px; line-height: 1.02; color: var(--ink); letter-spacing: -0.02em; margin-top: 6px; }
      #hook .q b { color: #a8792c; }

      #wm { position: absolute; right: 50px; top: 290px; z-index: 5; padding: 14px 24px; border-radius: 999px; background: rgba(255,255,255,0.92); }
      #wm img { width: 150px; display: block; }
      #pill { position: absolute; left: 50%; top: 300px; z-index: 5; padding: 18px 40px; border-radius: 999px; background: var(--teal); color: #fff; font-weight: 800; font-size: 46px; white-space: nowrap; border: 4px solid var(--gold); }

      /* CTA */
      #cta { z-index: 6; background: radial-gradient(120% 80% at 50% 30%, #357069 0%, var(--teal) 45%, var(--deep) 100%); color: #fff; }
      #cta-logo { position: absolute; left: 50%; top: 290px; width: 300px; margin-left: -150px; }
      #cta-t1 { top: 480px; font-weight: 900; font-size: 116px; line-height: 1; letter-spacing: -0.02em; }
      #cta-t2 { top: 610px; font-weight: 800; font-size: 68px; color: #fff3e0; }
      #cta-br { top: 712px; font-weight: 800; font-size: 36px; color: var(--gold); }
      #map { position: absolute; left: 50%; top: 790px; width: 470px; margin-left: -235px; border-radius: 30px; border: 6px solid #fff; box-shadow: 0 20px 50px rgba(0,0,0,0.35); }
      #arrow { position: absolute; left: 50%; top: 1420px; width: 110px; height: 110px; margin-left: -55px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1080" data-height="1920">
{{VIDEOS}}

      <div id="hook">
        <div class="k">Soalan yang selalu didengar:</div>
        <div class="q"><b>“</b>Bila nak dapat anak?<b>”</b></div>
      </div>
      <div id="wm"><img src="assets/img/logo-mya-dark.png" alt="Mya Clinic" /></div>
      <div id="pill">Saringan kesuburan suami &amp; isteri</div>

      <section id="cta" class="clip" data-start="{{TALK}}" data-duration="{{CTA_LEN}}" data-track-index="0">
        <img id="cta-logo" src="assets/img/logo-mya-white.png" alt="Mya Clinic" />
        <div class="center" id="cta-t1">Tekan di bawah</div>
        <div class="center" id="cta-t2">untuk temujanji</div>
        <div class="center" id="cta-br">Kg Pandan · Semambu · Gambang</div>
        <img id="map" src="assets/img/peta-kuantan.png" alt="Peta cawangan Mya Clinic Kuantan" />
        <svg id="arrow" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#d4af6a"/><path d="M12 6.5v10M7.5 12.5l4.5 4.5 4.5-4.5" fill="none" stroke="#173f3c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </section>

      <audio id="sfx-wh" src="assets/sfx/whoosh.wav" data-start="{{TALK}}" data-duration="0.5" data-volume="0.6" data-track-index="10"></audio>
      <audio id="sfx-pop" src="assets/sfx/pop.wav" data-start="{{T_POP}}" data-duration="0.15" data-volume="0.6" data-track-index="11"></audio>
      <audio id="sfx-ding" src="assets/sfx/ding.wav" data-start="{{T_DING}}" data-duration="0.9" data-volume="0.5" data-track-index="12"></audio>
    </div>

    <script>
      const TALK = {{TALK}}, SK_IN = {{SK_IN}}, SK_LEN = {{SK_LEN}};

      const tl = gsap.timeline({ paused: true });
      // hook card: on screen from frame 0, leaves after her "bila nak dapat anak?"
      tl.fromTo("#hook .q", { scale: 1.06 }, { scale: 1, duration: 0.5, ease: "power2.out" }, 0);
      tl.to("#hook", { y: 40, opacity: 0, duration: 0.35, ease: "power2.in" }, 3.3);
      // watermark after the hook
      tl.fromTo("#wm", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.6);
      tl.to("#wm", { opacity: 0, duration: 0.2 }, TALK - 0.2);
      // topic pill while she says "saringan kesuburan"
      tl.fromTo("#pill", { opacity: 0, xPercent: -50, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, SK_IN);
      tl.to("#pill", { opacity: 0, duration: 0.3 }, SK_IN + SK_LEN - 0.3);
      tl.to("#wm", { opacity: 0, duration: 0.2 }, SK_IN);
      tl.to("#wm", { opacity: 1, duration: 0.2 }, SK_IN + SK_LEN);
      // CTA
      tl.from("#cta", { opacity: 0, duration: 0.3 }, TALK);
      tl.from("#cta-logo", { y: -40, opacity: 0, duration: 0.4, ease: "power3.out" }, TALK + 0.1);
      tl.from("#cta-t1", { scale: 1.4, opacity: 0, duration: 0.45, ease: "power4.out" }, TALK + 0.35);
      tl.from("#cta-t2", { y: 30, opacity: 0, duration: 0.35, ease: "power3.out" }, TALK + 0.7);
      tl.from("#cta-br", { opacity: 0, duration: 0.35 }, TALK + 0.9);
      tl.from("#map", { y: 120, opacity: 0, duration: 0.45, ease: "power3.out" }, TALK + 1.0);
      tl.from("#arrow", { scale: 0, duration: 0.35, ease: "back.out(3)" }, TALK + 1.4);
      tl.to("#arrow", { y: 20, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 7 }, TALK + 1.8);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
