<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Jakarta"; src: url("fonts/jakarta-500.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Jakarta"; src: url("fonts/jakarta-700.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Jakarta"; src: url("fonts/jakarta-800.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "Fraunces"; src: url("fonts/fraunces-700.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Fraunces"; src: url("fonts/fraunces-600i.woff2") format("woff2"); font-weight: 600; font-style: italic; }
      :root {
        --ink: #11352c;
        --deep: #0f4a3a;
        --sage: #9fd8bc;
        --mint: #eaf7f0;
        --accent: #2f9e74;
        --lav: #c9b8f2;
        --warm: #ffd27a;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden; background: #0d1f1a;
        font-family: "Jakarta", "Inter", ui-sans-serif, system-ui, sans-serif;
      }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }

      /* footage */
      #vwrap { position: absolute; inset: 0; overflow: hidden; }
      #vzoom { position: absolute; inset: 0; transform-origin: 50% 36%; }
      #vzoom video { width: 100%; height: 100%; object-fit: cover; display: block; }
      #shade {
        position: absolute; inset: 0;
        background:
          linear-gradient(180deg, rgba(8,30,24,0.55) 0%, rgba(8,30,24,0) 26%),
          linear-gradient(0deg, rgba(8,30,24,0.62) 0%, rgba(8,30,24,0) 42%);
      }

      /* top-band cards */
      .topcard {
        position: absolute; left: 70px; right: 70px; top: 120px;
        display: flex; flex-direction: column; align-items: center; text-align: center;
      }
      .kicker {
        display: inline-block; padding: 14px 30px; border-radius: 999px;
        background: var(--mint); color: var(--deep);
        font-weight: 800; font-size: 34px; letter-spacing: 0.14em; text-transform: uppercase;
        box-shadow: 0 10px 30px rgba(0,0,0,0.18);
      }
      .big {
        margin-top: 22px; color: #fff; font-family: "Fraunces", Georgia, serif; font-weight: 700;
        font-size: 92px; line-height: 1.02; letter-spacing: -0.02em;
        text-shadow: 0 6px 28px rgba(0,0,0,0.35);
      }
      .big em { font-style: italic; font-weight: 600; color: var(--sage); }
      .sub {
        margin-top: 14px; color: var(--mint); font-weight: 700; font-size: 40px;
        text-shadow: 0 4px 18px rgba(0,0,0,0.4);
      }
      .line { display: block; overflow: hidden; padding: 0 16px 8px; }
      .line > span { display: inline-block; }

      /* chips (lower area, under captions) */
      .chips { position: absolute; left: 80px; right: 80px; top: 1500px; display: flex; flex-direction: column; gap: 22px; align-items: center; }
      .chip {
        display: flex; align-items: center; gap: 22px;
        padding: 20px 36px 20px 22px; border-radius: 30px;
        background: rgba(255,255,255,0.94); color: var(--ink);
        font-weight: 800; font-size: 44px; box-shadow: 0 14px 40px rgba(0,0,0,0.25);
      }
      .chip .ico {
        width: 74px; height: 74px; border-radius: 22px; flex: none;
        display: grid; place-items: center; background: var(--mint);
      }
      .chip.lav .ico { background: #efe9ff; }
      .chip svg { width: 46px; height: 46px; }

      /* "more common than we think" people row */
      .people { margin-top: 20px; display: flex; gap: 14px; justify-content: center; }
      .person { width: 52px; height: 80px; opacity: 0.35; }
      .person svg { width: 100%; height: 100%; }

      /* clinic badge */
      .badge {
        display: flex; align-items: center; gap: 22px; padding: 30px 46px;
        border-radius: 34px; background: #fff; box-shadow: 0 18px 50px rgba(0,0,0,0.25);
      }
      .badge img { display: block; width: 640px; height: auto; }
      .badge .mark {
        width: 92px; height: 92px; border-radius: 28px; background: var(--accent);
        display: grid; place-items: center;
      }
      .badge .mark svg { width: 56px; height: 56px; }
      .badge .name { font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 70px; color: var(--deep); letter-spacing: -0.01em; }
      .invite { margin-top: 20px; color: #fff; font-weight: 700; font-size: 44px; text-shadow: 0 4px 18px rgba(0,0,0,0.45); }

      /* captions */
      #caps { position: absolute; left: 60px; right: 60px; top: 1260px; height: 200px; }
      .cap {
        position: absolute; left: 0; right: 0; top: 0; text-align: center;
        font-weight: 800; font-size: 70px; line-height: 1.12; color: #fff;
        text-shadow: 0 5px 0 rgba(10,40,32,0.55), 0 8px 26px rgba(0,0,0,0.45);
        opacity: 0;
      }
      .cap .w { background-color: rgba(47,158,116,0); display: inline-block; margin: 0 9px; padding: 0 10px; border-radius: 16px; }
      .cap .w.key { color: var(--warm); }

      /* end card */
      #endbg { position: absolute; inset: 0; background: linear-gradient(170deg, #e9f6ef 0%, #cfe9dc 55%, #b7dcc9 100%); }
      #endcard { position: absolute; left: 80px; right: 80px; top: 0; height: 1920px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      #endcard .heart { width: 150px; height: 150px; }
      #endcard .eyebrow { margin-top: 40px; color: var(--accent); font-weight: 800; font-size: 34px; letter-spacing: 0.2em; text-transform: uppercase; }
      #endcard .head { margin-top: 18px; font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 104px; line-height: 1.02; color: var(--deep); }
      #endcard .head em { font-style: italic; font-weight: 600; color: var(--accent); }
      #endcard .rule { width: 160px; height: 8px; border-radius: 8px; background: #a98f3e; margin: 50px 0 40px; }
      #endcard .clinic { display: block; width: 720px; height: auto; }
      #wm { position: absolute; left: 50%; top: 34px; width: 230px; height: auto; margin-left: -115px; opacity: 0.9; }
      #endcard .tag { margin-top: 12px; font-weight: 700; font-size: 36px; color: #3d6b5c; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="19.36" data-width="1080" data-height="1920" data-fps="30">

      <!-- footage (pauses already cut out of clean.mp4) -->
      <div id="vwrap">
        <div id="vzoom">
          <video id="vid" src="assets/clean.mp4" playsinline data-has-audio="true" data-start="0" data-duration="19.36" data-track-index="0"></video>
        </div>
        <div id="shade"></div>
      </div>

      <!-- brand watermark -->
      <img id="wm" src="assets/logo-white.png" alt="Mya Clinic" data-start="0" data-duration="15.96" data-track-index="1" />

      <!-- 1. hook -->
      <div id="s-hook" class="clip" data-start="0" data-duration="2.82" data-track-index="2">
        <div class="topcard">
          <div class="kicker" id="hai">Hi!</div>
          <div class="big" style="font-size:80px">
            <span class="line"><span id="h1">Concerned about</span></span>
            <span class="line"><span id="h2"><em>your mental health?</em></span></span>
          </div>
        </div>
      </div>

      <!-- 2. very common -->
      <div id="s-common" class="clip" data-start="2.82" data-duration="2.95" data-track-index="2">
        <div class="topcard">
          <div class="kicker" id="cm-k">You are not alone</div>
          <div class="big"><span class="line"><span id="cm-1"><em>Very common</em></span></span></div>
          <div class="people" id="people"></div>
        </div>
      </div>

      <!-- 3. anxiety -->
      <div id="s-anx" class="clip" data-start="5.77" data-duration="4.3" data-track-index="2">
        <div class="topcard">
          <div class="kicker" id="anx-k">Symptoms of</div>
          <div class="big"><span class="line"><span id="anx-t"><em>Anxiety</em></span></span></div>
        </div>
        <div class="chips">
          <div class="chip" id="anx-c1">
            <div class="ico"><svg id="beat" viewBox="0 0 24 24"><path fill="#e0567a" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 5.3 3 1.7-1.9 3.2-3 5.3-3 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg></div>
            Palpitations
          </div>
          <div class="chip" id="anx-c2">
            <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#0f4a3a" stroke-width="2.2" stroke-linecap="round"><path d="M4 12c2-3 4 3 6 0s4 3 6 0 3 2 4 1"/><path d="M4 7c2-3 4 3 6 0s4 3 6 0 3 2 4 1"/><path d="M4 17c2-3 4 3 6 0s4 3 6 0 3 2 4 1"/></svg></div>
            Constant worrying
          </div>
        </div>
      </div>

      <!-- 4. depression -->
      <div id="s-dep" class="clip" data-start="10.07" data-duration="5.9" data-track-index="2">
        <div class="topcard">
          <div class="kicker" id="dep-k">Symptoms of</div>
          <div class="big"><span class="line"><span id="dep-t"><em>Depression</em></span></span></div>
        </div>
        <div class="chips">
          <div class="chip lav" id="dep-c1">
            <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#6a4fc4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l6 6 4-4 8 8"/><path d="M15 16h6v-6"/></svg></div>
            Low mood
          </div>
          <div class="chip lav" id="dep-c2">
            <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#6a4fc4" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 16c1.2-1.2 5.8-1.2 7 0"/><circle cx="9" cy="10" r="0.8" fill="#6a4fc4"/><circle cx="15" cy="10" r="0.8" fill="#6a4fc4"/></svg></div>
            Loss of interest in daily activities
          </div>
        </div>
      </div>

      <!-- captions -->
      <div id="s-caps" class="clip" data-start="0" data-duration="15.96" data-track-index="3">
        <div id="caps"></div>
      </div>

      <!-- 5. end card / CTA -->
      <div id="s-end" class="clip" data-start="15.96" data-duration="3.4" data-track-index="4">
        <div id="endbg"></div>
        <div id="endcard">
          <svg class="heart" id="end-heart" viewBox="0 0 24 24"><path fill="#2f9e74" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 5.3 3 1.7-1.9 3.2-3 5.3-3 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
          <div class="eyebrow" id="end-eb">Feeling this way?</div>
          <div class="head" id="end-h">We are here to <em>help</em></div>
          <div class="rule" id="end-rule"></div>
          <img class="clinic" id="end-cl" src="assets/logo-gold.png" alt="Mya Clinic" />
          <div class="tag" id="end-tag">Mental health assessment &amp; support</div>
        </div>
      </div>

      <!-- music + sfx -->
      <audio id="sfx-01-bgm" src="assets/bgm.wav" data-start="0" data-duration="19.36" data-volume="0.16" data-fade-out="1.5" data-track-index="5"></audio>
      <audio id="sfx-02-whoosh" src="assets/whoosh.wav" data-start="0.02" data-duration="0.55" data-volume="0.45" data-track-index="6"></audio>
      <audio id="sfx-03-pop" src="assets/pop.wav" data-start="0.12" data-duration="0.14" data-volume="0.5" data-track-index="7"></audio>
      <audio id="sfx-04-whoosh" src="assets/whoosh.wav" data-start="2.78" data-duration="0.55" data-volume="0.45" data-track-index="6"></audio>
      <audio id="sfx-05-sparkle" src="assets/sparkle.wav" data-start="3.6" data-duration="1.0" data-volume="0.35" data-track-index="7"></audio>
      <audio id="sfx-06-whoosh" src="assets/whoosh.wav" data-start="5.72" data-duration="0.55" data-volume="0.45" data-track-index="6"></audio>
      <audio id="sfx-07-heartbeat" src="assets/heartbeat.wav" data-start="7.72" data-duration="0.9" data-volume="0.9" data-track-index="7"></audio>
      <audio id="sfx-08-pop" src="assets/pop.wav" data-start="8.84" data-duration="0.14" data-volume="0.5" data-track-index="8"></audio>
      <audio id="sfx-09-whoosh" src="assets/whoosh.wav" data-start="10.02" data-duration="0.55" data-volume="0.45" data-track-index="6"></audio>
      <audio id="sfx-10-pop" src="assets/pop.wav" data-start="12.13" data-duration="0.14" data-volume="0.5" data-track-index="8"></audio>
      <audio id="sfx-11-pop" src="assets/pop.wav" data-start="13.09" data-duration="0.14" data-volume="0.5" data-track-index="7"></audio>
      <audio id="sfx-12-whoosh" src="assets/whoosh.wav" data-start="15.9" data-duration="0.55" data-volume="0.5" data-track-index="6"></audio>
      <audio id="sfx-13-ding" src="assets/ding.wav" data-start="16.3" data-duration="1.6" data-volume="0.42" data-track-index="8"></audio>
    </div>

    <script>
      // word timings (edited timeline), estimated from the Descript transcript + silence map
      const WORDS = [["Hi,", 0.126, 0.359], ["are", 0.359, 0.592], ["you", 0.592, 0.826], ["concerned", 0.826, 1.339], ["about", 1.339, 1.665], ["your", 1.665, 1.945], ["mental", 1.945, 2.318], ["health?", 2.318, 2.738], ["It", 2.924, 3.14], ["is", 3.14, 3.356], ["very", 3.356, 3.679], ["common", 3.679, 4.111], ["for", 4.111, 4.381], ["people", 4.381, 4.813], ["to", 4.813, 5.028], ["experience", 5.028, 5.836], ["symptoms", 5.836, 6.376], ["of", 6.376, 6.591], ["anxiety", 6.591, 7.237], ["such", 7.237, 7.561], ["as", 7.561, 7.777], ["palpitations", 7.777, 8.532], ["and", 8.611, 8.859], ["constant", 8.859, 9.355], ["worrying", 9.355, 10.01], ["or", 10.01, 10.209], ["symptoms", 10.209, 10.704], ["of", 10.704, 10.903], ["depression", 10.903, 11.498], ["such", 11.498, 11.955], ["as", 11.955, 12.153], ["low", 12.153, 12.401], ["mood", 12.401, 12.699], ["and", 12.699, 13.107], ["loss", 13.107, 13.404], ["of", 13.464, 13.674], ["interest", 13.674, 14.201], ["of", 14.201, 14.411], ["normal", 14.411, 14.832], ["daily", 14.832, 15.2], ["activities.", 15.2, 15.884]];
      const KEY = new Set(["mental","health?","common","anxiety","palpitations","worrying","depression","low","mood","interest"]);

      const tl = gsap.timeline({ paused: true });
      const E = "power3.out";
      const END = 15.96;

      // ---- captions: groups of up to 3 words, broken on punctuation ----
      const caps = document.getElementById("caps");
      const groups = []; let g = [];
      WORDS.forEach((w, i) => {
        g.push(w);
        const end = /[.,?]$/.test(w[0]) || g.length === 3 || (WORDS[i + 1] && WORDS[i + 1][1] - w[2] > 0.12);
        if (end) { groups.push(g); g = []; }
      });
      if (g.length) groups.push(g);
      groups.forEach((grp, gi) => {
        const el = document.createElement("div");
        el.className = "cap";
        grp.forEach((w) => {
          const s = document.createElement("span");
          s.className = "w" + (KEY.has(w[0]) ? " key" : "");
          s.textContent = w[0];
          el.appendChild(s);
        });
        caps.appendChild(el);
        const t0 = grp[0][1];
        const t1 = groups[gi + 1] ? groups[gi + 1][0][1] : Math.min(grp[grp.length - 1][2] + 0.3, END - 0.05);
        tl.fromTo(el, { opacity: 0, y: 26, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.16, ease: "back.out(2)" }, t0);
        tl.set(el, { opacity: 0 }, t1);
        [...el.children].forEach((s, k) => {
          const base = s.classList.contains("key") ? "#ffd27a" : "#ffffff";
          tl.set(s, { backgroundColor: "rgba(47,158,116,1)", color: "#ffffff" }, grp[k][1]);
          tl.set(s, { backgroundColor: "rgba(47,158,116,0)", color: base }, grp[k][2] + 0.02);
        });
      });

      // ---- punch-in zooms on every jump cut ----
      const cuts = [[0,1.0],[2.82,1.12],[5.48,1.0],[7.14,1.1],[9.93,1.0],[11.81,1.12],[12.94,1.02]];
      cuts.forEach(([t, s], i) => {
        const next = cuts[i + 1] ? cuts[i + 1][0] : END;
        tl.set("#vzoom", { scale: s }, t);
        tl.to("#vzoom", { scale: s + 0.035, duration: next - t, ease: "none" }, t);
      });
      tl.to("#vzoom", { scale: 1.2, duration: 0.8, ease: "power2.in" }, END);

      // helpers
      const rise = (sel, t, d = 0.55) => tl.fromTo(sel, { yPercent: 110 }, { yPercent: 0, duration: d, ease: E }, t);
      const pop = (sel, t) => tl.fromTo(sel, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2.2)" }, t);
      const slide = (sel, t, dir = -1) => tl.fromTo(sel, { x: 140 * dir, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, t);
      const out = (sel, t) => tl.to(sel, { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, t);

      // 1. hook
      pop("#hai", 0.1);
      tl.to("#hai", { rotation: 6, duration: 0.12, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.45);
      rise("#h1", 0.36); rise("#h2", 1.67);
      out("#s-hook .topcard", 2.6);

      // 2. very common
      pop("#cm-k", 2.86); rise("#cm-1", 3.36);
      const people = document.getElementById("people");
      for (let i = 0; i < 7; i++) {
        const p = document.createElement("div");
        p.className = "person";
        p.innerHTML = '<svg viewBox="0 0 26 40"><circle cx="13" cy="8" r="7" fill="#eaf7f0"/><path d="M1 40V26c0-6.6 5.4-12 12-12s12 5.4 12 12v14z" fill="#eaf7f0"/></svg>';
        people.appendChild(p);
        tl.fromTo(p, { y: 30, opacity: 0 }, { y: 0, opacity: 0.35, duration: 0.3, ease: E }, 3.5 + i * 0.05);
        tl.to(p, { opacity: 1, scale: 1.08, duration: 0.25, ease: E }, 4.38 + i * 0.1);
      }
      out("#s-common .topcard", 5.55);

      // 3. anxiety
      pop("#anx-k", 5.8); rise("#anx-t", 6.5);
      slide("#anx-c1", 7.74, -1);
      tl.to("#beat", { scale: 1.3, duration: 0.13, yoyo: true, repeat: 3, transformOrigin: "50% 50%", ease: "power2.out" }, 7.74);
      slide("#anx-c2", 8.84, 1);
      out("#s-anx .topcard", 9.85); out("#s-anx .chips", 9.85);

      // 4. depression
      pop("#dep-k", 10.1); rise("#dep-t", 10.85);
      slide("#dep-c1", 12.13, -1);
      slide("#dep-c2", 13.09, 1);
      out("#s-dep .topcard", 15.7); out("#s-dep .chips", 15.7);

      // 5. end card
      tl.fromTo("#endbg", { clipPath: "circle(0% at 50% 40%)" }, { clipPath: "circle(120% at 50% 40%)", duration: 0.7, ease: "power2.inOut" }, END);
      tl.fromTo("#end-heart", { scale: 0, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(2.5)" }, END + 0.35);
      tl.to("#end-heart", { scale: 1.1, duration: 0.35, yoyo: true, repeat: 3, ease: "sine.inOut" }, END + 1.0);
      tl.fromTo("#end-eb", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: E }, END + 0.5);
      tl.fromTo("#end-h", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, END + 0.6);
      tl.fromTo("#end-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: E }, END + 1.0);
      tl.fromTo("#end-cl", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, END + 1.15);
      tl.fromTo("#end-tag", { opacity: 0 }, { opacity: 1, duration: 0.45 }, END + 1.35);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
