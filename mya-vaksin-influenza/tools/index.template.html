<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Generated by tools/build.py from tools/index.template.html. GSAP bundled locally: no CDN. -->
    <script src="assets/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Poppins"; font-weight: 600; src: url("assets/fonts/poppins-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 700; src: url("assets/fonts/poppins-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 800; src: url("assets/fonts/poppins-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 900; src: url("assets/fonts/poppins-latin-900-normal.woff2") format("woff2"); }
      :root {
        /* Mya Clinic: gold from the clinic signage, black from the logo, cream from the FAQ poster */
        --gold: #ac9364;
        --gold-lite: #d8bd86; /* gold for text on dark boxes */
        --gold-deep: #8a733f;
        --black: #050505;
        --cream: #faf5ee;
        --cream-deep: #f1e8da;
        --red: #b3261e;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: "Poppins", sans-serif; color: var(--black); }
      .clip { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      video.seg { object-fit: cover; z-index: 1; }
      video.punch { transform: scale(1.07); transform-origin: 50% 28%; }
      .center { position: absolute; left: 0; right: 0; text-align: center; }

      .card { position: absolute; left: 70px; right: 70px; z-index: 5; padding: 34px 40px 40px; border-radius: 44px; background: var(--cream); border: 5px solid var(--black); box-shadow: 18px 18px 0 var(--gold); text-align: center; }
      .tag { display: inline-block; padding: 10px 30px; border-radius: 999px; background: var(--black); color: var(--gold-lite); font-weight: 800; font-size: 38px; letter-spacing: 0.04em; }

      #hook { top: 830px; }
      #hook .t { font-weight: 900; font-size: 92px; line-height: 1.02; letter-spacing: -0.02em; margin-top: 14px; }
      #hook .s { font-weight: 800; font-size: 48px; color: var(--gold-deep); margin-top: 10px; }

      .myth { top: 830px; opacity: 0; }
      .myth .t { font-weight: 800; font-size: 60px; line-height: 1.12; margin-top: 16px; }
      .stamp { position: absolute; right: -24px; top: -46px; padding: 10px 28px; border: 6px solid var(--red); border-radius: 18px; color: var(--red); background: var(--cream); font-weight: 900; font-size: 56px; letter-spacing: 0.06em; transform: rotate(8deg) scale(0); }

      #lt { position: absolute; left: 60px; top: 1060px; z-index: 5; display: flex; align-items: stretch; opacity: 0; }
      #lt .bar { width: 14px; background: var(--gold); border-radius: 7px 0 0 7px; }
      #lt .box { padding: 18px 30px 20px; background: var(--cream); border-radius: 0 26px 26px 0; }
      #lt .n { font-weight: 800; font-size: 42px; line-height: 1.15; }
      #lt .r { font-weight: 600; font-size: 32px; color: var(--gold-deep); }

      #wm { position: absolute; right: 50px; top: 290px; z-index: 5; width: 112px; height: 112px; border-radius: 50%; background: rgba(250, 245, 238, 0.92); display: flex; align-items: center; justify-content: center; }
      #wm img { width: 76px; }

      .cap { position: absolute; left: 60px; right: 60px; top: 1330px; z-index: 6; text-align: center; opacity: 0; }
      .cap .in { display: inline-block; padding: 16px 28px 20px; border-radius: 28px; background: rgba(5, 5, 5, 0.86); color: #fff; font-weight: 800; font-size: 58px; line-height: 1.2; }
      .cap .w { display: inline-block; margin: 0 7px; }

      /* CTA end card */
      #cta { z-index: 8; background: var(--cream); }
      #cta .blob { position: absolute; border-radius: 50%; background: var(--cream-deep); }
      #cta-logo { position: absolute; left: 50%; top: 360px; width: 800px; margin-left: -400px; }
      #cta-tag { top: 520px; font-weight: 800; font-size: 46px; color: var(--gold-deep); letter-spacing: 0.02em; }
      #cta-t1 { top: 700px; font-weight: 900; font-size: 118px; line-height: 1; letter-spacing: -0.02em; }
      #cta-t2 { top: 840px; font-weight: 800; font-size: 66px; }
      #cta-br { top: 1000px; }
      #cta-br .tag { font-size: 36px; padding: 12px 30px; margin: 8px 0; }
      #arrow { position: absolute; left: 50%; top: 1250px; width: 130px; height: 130px; margin-left: -65px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1080" data-height="1920">
{{VIDEOS}}

      <div id="hook" class="card">
        <span class="tag">DOKTOR JAWAB</span>
        <div class="t">5 mitos vaksin influenza</div>
        <div class="s">untuk ibu mengandung</div>
      </div>
      <div id="myths"></div>
      <div id="lt"><div class="bar"></div><div class="box"><div class="n">Dr Siti Noor Munirah Ibrahim</div><div class="r">Family Medicine Specialist · Mya Clinic</div></div></div>
      <div id="wm"><img src="assets/img/icon-gold.png" alt="" /></div>
      <div id="caps"></div>

      <section id="cta" class="clip" data-start="{{TALK}}" data-duration="{{CTA_LEN}}" data-track-index="0">
        <div class="blob" style="width: 900px; height: 900px; left: -380px; top: -300px"></div>
        <div class="blob" style="width: 1000px; height: 1000px; right: -520px; bottom: -380px"></div>
        <img id="cta-logo" src="assets/img/logo-horizontal-black.png" alt="Mya Clinic" />
        <div class="center" id="cta-tag">Safe Space for Women</div>
        <div class="center" id="cta-t1">Tekan di bawah</div>
        <div class="center" id="cta-t2">untuk temujanji</div>
        <div class="center" id="cta-br"><span class="tag">Kg Pandan · Semambu · Gambang</span><br /><span class="tag">Melawati KL</span></div>
        <svg id="arrow" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#050505"/><path d="M12 6.5v10M7.5 12.5l4.5 4.5 4.5-4.5" fill="none" stroke="#d8bd86" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </section>

      <audio id="a-bed" src="assets/sfx/bed-soft.wav" data-start="0" data-duration="{{TOTAL}}" data-volume="0.07" data-fade-out="1.5" data-track-index="10"></audio>
{{MYTH_SFX}}
      <audio id="sfx-wh" src="assets/sfx/whoosh.wav" data-start="{{TALK}}" data-duration="0.5" data-volume="0.5" data-track-index="13"></audio>
      <audio id="sfx-pop" src="assets/sfx/pop.wav" data-start="{{T_POP}}" data-duration="0.15" data-volume="0.6" data-track-index="14"></audio>
      <audio id="sfx-ding" src="assets/sfx/ding.wav" data-start="{{T_DING}}" data-duration="0.9" data-volume="0.45" data-track-index="15"></audio>
    </div>

    <script>
      const DATA = {{DATA}};
      const TALK = DATA.talk;
      const HOOK_END = 2.4;

      // ---- build captions and myth cards (deterministic, from DATA) ----
      const capHost = document.getElementById("caps");
      DATA.chunks.forEach((c, i) => {
        const d = document.createElement("div");
        d.className = "cap";
        d.id = "cap" + i;
        if (c.t[0] <= 0.01) d.style.opacity = "1";
        d.innerHTML = '<div class="in">' + c.w.map((w, j) => '<span class="w" id="w' + i + "_" + j + '">' + w + "</span>").join("") + "</div>";
        capHost.appendChild(d);
      });
      const mythHost = document.getElementById("myths");
      DATA.myths.forEach((m) => {
        const d = document.createElement("div");
        d.className = "card myth";
        d.id = "myth" + m.n;
        d.innerHTML = '<span class="tag">MITOS #' + m.n + '</span><div class="t">' + m.text + '</div><div class="stamp">✗ SALAH</div>';
        mythHost.appendChild(d);
      });

      const tl = gsap.timeline({ paused: true });

      // hook card: on screen from frame 0
      tl.fromTo("#hook", { scale: 1.04 }, { scale: 1, duration: 0.4, ease: "power2.out" }, 0);
      tl.to("#hook", { scale: 0.9, opacity: 0, duration: 0.25, ease: "power2.in" }, HOOK_END - 0.25);

      // myth cards
      DATA.myths.forEach((m) => {
        const tin = Math.max(m.in, HOOK_END);
        const el = "#myth" + m.n;
        tl.fromTo(el, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" }, tin);
        tl.to(el + " .stamp", { scale: 1, duration: 0.3, ease: "back.out(3)" }, m.salah);
        tl.fromTo(el, { x: 0 }, { x: 10, duration: 0.05, yoyo: true, repeat: 3, ease: "none" }, m.salah);
        tl.to(el, { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, m.salah + 1.3);
      });

      // doctor lower third, after myth 1 is answered
      const LT_IN = DATA.myths[0].salah + 1.7;
      tl.fromTo("#lt", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, LT_IN);
      tl.to("#lt", { opacity: 0, x: -60, duration: 0.3, ease: "power2.in" }, LT_IN + 5);

      // word-by-word captions: chunk visible over its span, active word gold
      DATA.chunks.forEach((c, i) => {
        if (c.t[0] > 0.01) tl.set("#cap" + i, { opacity: 1 }, c.t[0]);
        tl.set("#cap" + i, { opacity: 0 }, Math.min(c.end, TALK));
        c.w.forEach((w, j) => {
          const on = c.t[j];
          const off = j + 1 < c.t.length ? c.t[j + 1] : c.end;
          tl.set("#w" + i + "_" + j, { color: "#d8bd86" }, on);
          tl.set("#w" + i + "_" + j, { color: "#ffffff" }, off);
        });
      });

      // CTA
      tl.to("#wm", { opacity: 0, duration: 0.2 }, TALK - 0.2);
      tl.from("#cta", { opacity: 0, duration: 0.3 }, TALK);
      tl.from("#cta-logo", { y: -40, opacity: 0, duration: 0.45, ease: "power3.out" }, TALK + 0.1);
      tl.from("#cta-tag", { opacity: 0, duration: 0.4 }, TALK + 0.4);
      tl.from("#cta-t1", { scale: 1.4, opacity: 0, duration: 0.45, ease: "power4.out" }, TALK + 0.6);
      tl.from("#cta-t2", { y: 30, opacity: 0, duration: 0.35, ease: "power3.out" }, TALK + 0.9);
      tl.from("#cta-br", { opacity: 0, y: 20, duration: 0.4 }, TALK + 1.1);
      tl.from("#arrow", { scale: 0, duration: 0.35, ease: "back.out(3)" }, TALK + 1.4);
      tl.to("#arrow", { y: 22, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 7 }, TALK + 1.8);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
