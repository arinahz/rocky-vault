<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Generated by tools/build.py from tools/index.template.html. GSAP bundled locally: no CDN. -->
    <script src="assets/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Poppins"; font-weight: 600; src: url("assets/fonts/poppins-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 700; src: url("assets/fonts/poppins-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 800; src: url("assets/fonts/poppins-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Poppins"; font-weight: 900; src: url("assets/fonts/poppins-latin-900-normal.woff2") format("woff2"); }
      :root { --gold: #ac9364; --gold-lite: #d8bd86; --gold-deep: #8a733f; --black: #050505; --cream: #faf5ee; --cream-deep: #f1e8da; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: "Poppins", sans-serif; color: var(--black); }
      .clip { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      video.seg { object-fit: cover; z-index: 1; }
      video.punch { transform: scale(1.07); transform-origin: 50% 30%; }
      .center { position: absolute; left: 0; right: 0; text-align: center; }
      .tag { display: inline-block; padding: 10px 28px; border-radius: 999px; background: var(--black); color: var(--gold-lite); font-weight: 800; font-size: 34px; letter-spacing: 0.04em; }

      /* b-roll story lines: big, on a cream card, readable on frame 0 */
      .bline { position: absolute; left: 70px; right: 70px; top: 1150px; z-index: 5; padding: 34px 36px 38px; border-radius: 44px; background: var(--cream); border: 5px solid var(--black); box-shadow: 18px 18px 0 var(--gold); text-align: center; font-weight: 900; font-size: 74px; line-height: 1.08; letter-spacing: -0.02em; opacity: 0; }
      #b-kicker { position: absolute; left: 0; right: 0; top: 300px; z-index: 5; text-align: center; }

      .card { position: absolute; left: 70px; right: 70px; top: 880px; z-index: 5; padding: 30px 36px 36px; border-radius: 44px; background: var(--cream); border: 5px solid var(--black); box-shadow: 18px 18px 0 var(--gold); text-align: center; opacity: 0; }
      .card .t { font-weight: 800; font-size: 60px; line-height: 1.12; margin-top: 12px; }
      .card .t:first-child { margin-top: 0; }

      #lt { position: absolute; left: 60px; top: 1080px; z-index: 5; display: flex; align-items: stretch; opacity: 0; }
      #lt .bar { width: 14px; background: var(--gold); border-radius: 7px 0 0 7px; }
      #lt .box { padding: 18px 30px 20px; background: var(--cream); border-radius: 0 26px 26px 0; }
      #lt .n { font-weight: 800; font-size: 42px; line-height: 1.15; }
      #lt .r { font-weight: 600; font-size: 32px; color: var(--gold-deep); }

      #wm { position: absolute; right: 50px; top: 290px; z-index: 5; width: 112px; height: 112px; border-radius: 50%; background: rgba(250, 245, 238, 0.92); display: flex; align-items: center; justify-content: center; }
      #wm img { width: 76px; }

      .cap { position: absolute; left: 60px; right: 60px; top: 1330px; z-index: 6; text-align: center; opacity: 0; }
      .cap .in { display: inline-block; padding: 16px 28px 20px; border-radius: 28px; background: rgba(5, 5, 5, 0.86); color: #fff; font-weight: 800; font-size: 58px; line-height: 1.2; }
      .cap .w { display: inline-block; margin: 0 7px; }

      #cta { z-index: 8; background: var(--cream); }
      #cta .blob { position: absolute; border-radius: 50%; background: var(--cream-deep); }
      #cta-logo { position: absolute; left: 50%; top: 360px; width: 800px; margin-left: -400px; }
      #cta-tag { top: 520px; font-weight: 800; font-size: 46px; color: var(--gold-deep); }
      #cta-k { top: 660px; }
      #cta-t1 { top: 760px; font-weight: 900; font-size: 118px; line-height: 1; letter-spacing: -0.02em; }
      #cta-t2 { top: 900px; font-weight: 800; font-size: 66px; }
      #cta-br { top: 1040px; font-weight: 700; font-size: 40px; color: var(--black); }
      #arrow { position: absolute; left: 50%; top: 1200px; width: 130px; height: 130px; margin-left: -65px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1080" data-height="1920">
{{VIDEOS}}

      <div id="b-kicker"><span class="tag">SPECIALIST CONSULT ONLINE</span></div>
      <div id="blines"></div>
      <div id="cards"></div>
      <div id="lt"><div class="bar"></div><div class="box"><div class="n">Dr Siti Noor Munirah Ibrahim</div><div class="r">Family Medicine Specialist · Mya Clinic</div></div></div>
      <div id="wm"><img src="assets/img/icon-gold.png" alt="" /></div>
      <div id="caps"></div>

      <section id="cta" class="clip" data-start="{{TALK_END}}" data-duration="{{CTA_LEN}}" data-track-index="0">
        <div class="blob" style="width: 900px; height: 900px; left: -380px; top: -300px"></div>
        <div class="blob" style="width: 1000px; height: 1000px; right: -520px; bottom: -380px"></div>
        <img id="cta-logo" src="assets/img/logo-horizontal-black.png" alt="Mya Clinic" />
        <div class="center" id="cta-tag">Safe Space for Women</div>
        <div class="center" id="cta-k"><span class="tag">ONLINE CONSULT · ANYWHERE</span></div>
        <div class="center" id="cta-t1">Tap below</div>
        <div class="center" id="cta-t2">to book an appointment</div>
        <div class="center" id="cta-br">Mya Clinic Melawati</div>
        <svg id="arrow" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#050505"/><path d="M12 6.5v10M7.5 12.5l4.5 4.5 4.5-4.5" fill="none" stroke="#d8bd86" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </section>

      <!-- music: fuller under the silent b-roll, ducked under the voice -->
      <audio id="a-bed1" src="assets/sfx/bed-soft.wav" data-start="0" data-duration="{{BROLL}}" data-volume="0.3" data-track-index="10"></audio>
      <audio id="a-bed2" src="assets/sfx/bed-soft.wav" data-start="{{BROLL}}" data-duration="{{BED2_LEN}}" data-media-start="{{BROLL}}" data-volume="0.07" data-fade-out="1.2" data-track-index="10"></audio>
{{SFX}}
    </div>

    <script>
      const DATA = {{DATA}};
      const T0 = DATA.talkStart, T1 = DATA.talkEnd;

      const bHost = document.getElementById("blines");
      DATA.broll.forEach((b, i) => {
        const d = document.createElement("div");
        d.className = "bline";
        d.id = "bl" + i;
        if (i === 0) d.style.opacity = "1"; // readable on frame 0
        d.innerHTML = b.line;
        bHost.appendChild(d);
      });
      const cHost = document.getElementById("cards");
      DATA.cards.forEach((c, i) => {
        const d = document.createElement("div");
        d.className = "card";
        d.id = "card" + i;
        d.innerHTML = c.html;
        cHost.appendChild(d);
      });
      const capHost = document.getElementById("caps");
      DATA.chunks.forEach((c, i) => {
        const d = document.createElement("div");
        d.className = "cap";
        d.id = "cap" + i;
        d.innerHTML = '<div class="in">' + c.w.map((w, j) => '<span class="w" id="w' + i + "_" + j + '">' + w + "</span>").join("") + "</div>";
        capHost.appendChild(d);
      });

      const tl = gsap.timeline({ paused: true });

      // b-roll story lines
      DATA.broll.forEach((b, i) => {
        const el = "#bl" + i;
        if (i > 0) tl.fromTo(el, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, b.t);
        else tl.fromTo(el, { scale: 1.04 }, { scale: 1, duration: 0.4, ease: "power2.out" }, 0);
        tl.to(el, { opacity: 0, duration: 0.2 }, b.t + b.d - 0.2);
      });
      tl.to("#b-kicker", { opacity: 0, duration: 0.3 }, T0 - 0.3);

      // info cards while she talks
      DATA.cards.forEach((c, i) => {
        tl.fromTo("#card" + i, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" }, c.t);
        tl.to("#card" + i, { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, c.t + c.d);
      });

      // doctor lower third at the start of the talking head
      tl.fromTo("#lt", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, T0 + 0.2);
      tl.to("#lt", { opacity: 0, x: -60, duration: 0.3, ease: "power2.in" }, T0 + 2.6);

      // captions
      DATA.chunks.forEach((c, i) => {
        tl.set("#cap" + i, { opacity: 1 }, c.t[0]);
        tl.set("#cap" + i, { opacity: 0 }, Math.min(c.end, T1));
        c.w.forEach((w, j) => {
          const off = j + 1 < c.t.length ? c.t[j + 1] : c.end;
          tl.set("#w" + i + "_" + j, { color: "#d8bd86" }, c.t[j]);
          tl.set("#w" + i + "_" + j, { color: "#ffffff" }, off);
        });
      });

      // CTA
      tl.to("#wm", { opacity: 0, duration: 0.2 }, T1 - 0.2);
      tl.from("#cta", { opacity: 0, duration: 0.3 }, T1);
      tl.from("#cta-logo", { y: -40, opacity: 0, duration: 0.45, ease: "power3.out" }, T1 + 0.1);
      tl.from("#cta-tag", { opacity: 0, duration: 0.4 }, T1 + 0.3);
      tl.from("#cta-k", { scale: 0, duration: 0.35, ease: "back.out(2.5)" }, T1 + 0.45);
      tl.from("#cta-t1", { scale: 1.4, opacity: 0, duration: 0.45, ease: "power4.out" }, T1 + 0.6);
      tl.from("#cta-t2", { y: 30, opacity: 0, duration: 0.35, ease: "power3.out" }, T1 + 0.9);
      tl.from("#cta-br", { opacity: 0, duration: 0.4 }, T1 + 1.0);
      tl.from("#arrow", { scale: 0, duration: 0.35, ease: "back.out(3)" }, T1 + 1.1);
      tl.to("#arrow", { y: 22, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 6 }, T1 + 1.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
